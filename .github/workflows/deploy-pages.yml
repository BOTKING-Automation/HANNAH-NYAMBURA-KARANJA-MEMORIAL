name: Deploy memorial website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "hannah-memorial-pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble the site with its published URL structure
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R public _site/public
      - name: Upload full memorial website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish memorial website
        id: deployment
        uses: actions/deploy-pages@v4
